# Splunk Universal Forwarder Kali Linux VM Configuration
# Location: /opt/splunkforwarder/etc/system/local/inputs.conf

[monitor:///var/log/auth.log]
disabled = false
index = sh-kali
sourcetype = linux_secure

[monitor:///var/log/audit/audit.log]
disabled = false
index = sh-kali
sourcetype = linux_audit

[monitor:///var/log/kern.log]
disabled = false
index = sh-kali
sourcetype = linux_kernel

[monitor:///var/log/dpkg.log]
disabled = false
index = sh-kali
sourcetype = dpkg

[monitor:///var/log/apt/history.log]
disabled = false
index = sh-kali
sourcetype = apt_history

# Optional: Broader system/service visibility (may add volume)
[monitor:///var/log/syslog]
disabled = false
index = sh-kali
sourcetype = syslog
